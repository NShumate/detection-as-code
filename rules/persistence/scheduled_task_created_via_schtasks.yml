title: Scheduled Task Created via Schtasks
id: 1d6790f8-8d66-409a-b25d-8d7e2e76a8c1
status: experimental
description: Detects creation of a scheduled task using schtasks.exe with a create action.
author: Nathan Shumate
date: 2026/10/11
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\\schtasks.exe'
    selection_cmdline:
        CommandLine|contains:
            - '/create'
    condition: selection_image and selection_cmdline
falsepositives:
    - Scheduled tasks created by IT automation or routine maintenance
level: medium
