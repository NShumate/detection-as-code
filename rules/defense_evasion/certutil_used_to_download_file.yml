title: Certutil Used to Download a File
id: 2ef503d5-9e68-4a2d-9893-c3f8b93f7d64
status: experimental
description: Detects certutil.exe usage associated with downloading a file via the URL cache.
author: Nathan Shumate
date: 2026/10/11
tags:
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\\certutil.exe'
    selection_cmdline:
        CommandLine|contains:
            - 'urlcache'
    condition: selection_image and selection_cmdline
falsepositives:
    - Administrative script or maintenance routines using certutil
level: medium
