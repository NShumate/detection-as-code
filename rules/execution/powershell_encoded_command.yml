title: PowerShell Launched With Encoded Command
id: 6ddd6189-6405-4f7f-b422-d38b5598655e
status: experimental
description: Detects PowerShell started with an encoded command argument, a common way to hide payloads.
author: Nathan Shumate
date: 2026/10/07
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cmdline:
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand '
    condition: selection_image and selection_cmdline
falsepositives:
    - Legitimate admin tools and management agents that use encoded commands
level: medium
